; PlatformIO Project Configuration for Enigma Mini Datapack (Hero Prop)
; Target: ESP32-S3-MINI-1 (Module)

[env:esp32s3_mini]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Target MCU Configuration
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.partitions = default_8MB.csv

; Monitor & Upload Settings
monitor_speed = 115200
upload_flags =
    --after=watchdog_reset

; USB & Build Settings:
; ARDUINO_USB_MODE=0 enables native TinyUSB / USB MSC support in Arduino core
; ARDUINO_USB_CDC_ON_BOOT=0 prevents app_main() from starting USB before StorageManager initializes SD + MSC
board_build.extra_flags =
    -DARDUINO_ESP32S3_DEV
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_RUNNING_CORE=1
    -DARDUINO_EVENT_RUNNING_CORE=1

build_flags = 
    -DCORE_DEBUG_LEVEL=2
    -DLGFX_AUTODETECT=0

lib_deps = 
    lovyan03/LovyanGFX @ ^1.1.16
    adafruit/Adafruit NeoPixel @ ^1.12.0
